syntax = "proto3";

package SimPitchProtos.SimulationService.IterationResult;

import "IterationResult/requests.proto";
import "IterationResult/responses.proto";
import "commonTypes.proto";

option csharp_namespace = "SimPitchProtos.SimulationService.IterationResult";


service IterationResultService {
  rpc GetIterationResultById (IterationResultByIdRequest) returns (IterationResultByIdResponse);
  rpc GetIterationResultsBySimulationId (IterationResultsBySimulationIdRequest) returns (stream IterationResultsBySimulationIdResponse);
}