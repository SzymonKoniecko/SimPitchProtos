syntax = "proto3";

package SimPitchProtos.SimulationService.SimulationEngine;

import "commonTypes.proto";

option csharp_namespace = "SimPitchProtos.SimulationService.SimulationEngine";

message RunSimulationEngineResponse{
  string simulation_id = 1;
}

message SimulationOverviewResponse{
  SimulationOverviewGrpc simulation_overview = 1;
}

message SimulationOverviewsPagedResponse{
  repeated SimulationOverviewGrpc items = 1;
  int32 total_count = 2;
}

message SimulationStateResponse{
  SimulationStateGrpc simulation_state = 1;
}

message StopSimulationResponse{
  string status = 1;
}