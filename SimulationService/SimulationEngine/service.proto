syntax = "proto3";

package SimPitchProtos.SimulationService.SimulationEngine;


import "SimulationService/SimulationEngine/requests.proto";
import "SimulationService/SimulationEngine/responses.proto";
import "SimulationService/commonTypes.proto";

option csharp_namespace = "SimPitchProtos.SimulationService.SimulationEngine";

service SimulationEngineService {
  rpc RunSimulation (RunSimulationEngineRequest) returns (RunSimulationEngineResponse);
  rpc GetSimulationOverviewById (GetSimulationOverviewByIdRequest) returns (SimulationOverviewResponse);
  rpc GetAllSimulationOverviews (PagedRequestGrpc) returns (SimulationOverviewsPagedResponse);
  rpc GetSimulationStateById(GetSimulationStateByIdRequest) returns (SimulationStateResponse);
  rpc GetLatestSimulationIds(GetLatestSimulationIdsRequest) returns (SimulationIdsResponse);
  rpc StopSimulationById(StopSimulationRequest) returns (StopSimulationResponse);
}