syntax = "proto3";

package SimPitchProtos.SportsDataService.League;

import "SportsDataService/League/requests.proto";
import "SportsDataService/League/responses.proto";
import "SportsDataService/commonTypes.proto";

option csharp_namespace = "SimPitchProtos.SportsDataService.League";

service LeagueService {
  rpc GetLeaguesByCountryId (LeaguesByCountryIdRequest) returns (LeaguesByCountryIdResponse);
  rpc GetLeagueById (LeagueByIdRequest) returns (LeagueGrpc);
}