syntax = "proto3";

package SimPitchProtos.SportsDataService.Team;


option csharp_namespace = "SimPitchProtos.SportsDataService.Team";

message TeamByIdRequest {
  string id = 1;
}

message CreateTeamRequest {
  string name = 1;
  string country_id = 2;
  string stadium_id = 3;
  string league_id = 4;
  string logo_url = 5;
  string short_name = 6;
  string sport = 7;
}
