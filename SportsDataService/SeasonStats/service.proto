syntax = "proto3";

package SimPitchProtos.SportsDataService.SeasonStats;

import "SportsDataService/SeasonStats/requests.proto";
import "SportsDataService/SeasonStats/responses.proto";

option csharp_namespace = "SimPitchProtos.SportsDataService.SeasonStats";

service SeasonStatsService {
  rpc GetSeasonsStatsByTeamId(SeasonStatsByTeamIdRequest) returns (SeasonStatsByTeamIdResponse);
  rpc GetSeasonStatsByLeagueAndSeasonYear(SeasonStatsByLeagueAndSeasonYearRequest) returns (SeasonStatsByLeagueAndSeasonYearResponse);
}