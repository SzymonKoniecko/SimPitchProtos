syntax = "proto3";

package loggingProto;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "LoggingService.SimPitchProtos";

service LogService {
  rpc LogEntry (LogEntryRequest) returns (google.protobuf.Empty);
}

message LogEntryRequest {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string message = 3;
  string level = 4;
  string stack_trace = 5;
  string source = 6;
  string context = 7;
}